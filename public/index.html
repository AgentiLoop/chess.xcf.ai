<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess — play online, vs computer or a friend · chess.xcf.ai</title>
<meta name="description" content="Free online chess in the browser: play the computer at three levels, a friend on the same screen, or anyone online with a room link. Built by AgentiLoop Agent!.">
<meta property="og:title" content="Chess · chess.xcf.ai">
<meta property="og:description" content="Play chess online: vs computer, same screen or online multiplayer. Built by AgentiLoop Agent!.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="chess.xcf.ai">
<meta property="og:url" content="https://chess.xcf.ai/">
<meta property="og:image" content="https://chess.xcf.ai/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Chess board in the browser mid-game">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chess · chess.xcf.ai">
<meta name="twitter:description" content="Play chess online: vs computer, same screen or online multiplayer. Built by AgentiLoop Agent!.">
<meta name="twitter:image" content="https://chess.xcf.ai/og.png">
<meta name="twitter:image:alt" content="Chess board in the browser mid-game">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="logo">♞</span> Chess</a>
  <span class="by">by <a href="https://agentiloop.ai/#games" target="_blank" rel="noopener">AgentiLoop Agent!</a></span>
</header>

<main id="game" class="game">
  <div class="boardWrap">
    <div id="tagTop" class="tag"></div>
    <div id="board" class="board"></div>
    <div id="tagBottom" class="tag"></div>
  </div>
  <aside class="card side">
    <section class="panel-now">
      <div class="turn"><span id="turnDot" class="turn-dot w"></span><div><div id="status" class="status"></div><div id="mode" class="mode"></div></div></div>
      <div class="moves-head"><span>Moves</span><label class="promo">Promote <select id="promo"><option value="q">♛ Queen</option><option value="r">♜ Rook</option><option value="b">♝ Bishop</option><option value="n">♞ Knight</option></select></label></div>
      <ol id="moves" class="moves"></ol>
      <div class="btns">
        <button id="undo" title="Undo"><span>↶</span>Undo</button>
        <button id="flip" title="Flip board"><span>⇅</span>Flip</button>
        <button id="resign" class="danger" title="Resign"><span>⚑</span>Resign</button>
        <button id="again" hidden><span>↻</span>Rematch</button>
      </div>
    </section>
    <section class="panel-new">
      <div class="panel-label">New game</div>
      <div class="tabs" id="modeSel"><button data-v="ai" class="on"><span>🤖</span>Computer</button><button data-v="local"><span>👥</span>2 Players</button><button data-v="online"><span>🌐</span>Online</button></div>
      <div id="aiOpts" class="opts">
        <div class="seg" id="color"><button data-v="w" class="on">♔ White</button><button data-v="b">♚ Black</button></div>
        <div class="seg" id="level"><button data-v="1">Easy</button><button data-v="2" class="on">Medium</button><button data-v="3">Hard</button></div>
      </div>
      <div id="onlineOpts" class="opts" hidden>
        <form id="joinForm"><input id="joinCode" maxlength="8" placeholder="Have a room code?" autocomplete="off"><button>Join</button></form>
      </div>
      <button class="go" id="newGame">Start new game</button>
      <div class="share" id="share"><span class="share-ico">🔗</span><input id="shareLink" readonly placeholder="Pick Online to get an invite link"><button id="copy">Copy</button></div>
    </section>
  </aside>
</main>

<footer class="foot">Made with <a href="https://agentiloop.ai" target="_blank" rel="noopener">AgentiLoop Agent!</a> · <a href="https://github.com/AgentiLoop/chess.xcf.ai" target="_blank" rel="noopener">Source</a> · Also: <a href="https://go.xcf.ai">go.xcf.ai</a></footer>
<script type="module" src="/app.js"></script>
</body>
</html>
